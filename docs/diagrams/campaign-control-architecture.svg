<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 720 405" role="img" aria-labelledby="title description"><title id="title">Campaign Control architecture</title><desc id="description">Campaign Control reads campaign assets, a change brief, and Profound buyer-question context. It interprets, updates assets and audits meaning using parallel AI calls. Dedicated subagents are planned. Configurable OpenAI or Anthropic models are implemented; other providers need planned adapters. Proposed MCP integrations include Google Drive, Slack and Notion. Human review approves a channel-organized package or rejects a version for brief revision.</desc><rect width="720" height="405" fill="#15212D"/>
